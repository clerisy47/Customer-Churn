[project]
name = "churn-mlops"
version = "0.1.0"
description = "Production MLOps pipeline for Telco Customer Churn"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.14,<3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "evidently>=0.4.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow>=2.9,<2.11",
]

[project.scripts]
churn-train = "churn.train:main"
churn-monitor = "churn.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.uv]
package = true
